[project]
name = "wuwastats"
version = "0.1.0"
description = "Analisador de echos de Wuthering Waves"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "mss>=10.2.0",
    "openai>=3.41.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
wuwastats = "wuwastats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wuwastats"]

[tool.pytest.ini_options]
testpaths = ["src", "scripts"]
addopts = "-q"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
